services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENCLAW_SKIP_CHANNELS: "1"
      OPENCLAW_CONFIG_PATH: /tmp/openclaw-config/openclaw.json
      WORKCHAT_HOME: /home/node/.openclaw/workchat
    volumes:
      - ${OPENCLAW_CONFIG_FILE:-./openclaw.json}:/tmp/openclaw-config/openclaw.json:ro
      - openclaw-state:/home/node/.openclaw
    command:
      [
        "node",
        "openclaw.mjs",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "lan",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  main:
    healthcheck:
      disable: true
    volumes:
      - openclaw-state:/tmp/openclaw-state:ro
    depends_on:
      openclaw:
        condition: service_healthy

volumes:
  openclaw-state:
